{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Page</title>

        <!-- X icon -->
    <link rel="shortcut icon" type='x-icon' href="{% static 'IMG/Logo/logo.jpg' %}">

    <!-- Bootstrap 5 link -->
     
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.min.js" integrity="sha384-0pUGZvbkm6XF6gxjEnlmuGrJXVbNuzT9qBBavbLwCsOGabYfZo0T0to5eqruptLy" crossorigin="anonymous"></script>

    <!-- CSS static link -->
     <link rel="stylesheet" href="{% static 'design/index.css' %}">
     <link rel="stylesheet" href="{% static 'design/Upload.css' %}">
     <link rel="stylesheet" href="{% static 'Font/font.css' %}">
     <link rel="stylesheet" href="{% static 'Animation/animation.css' %}">
     <link rel="stylesheet" href="/Website/templates/Image_con/img.css">


    <!-- Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&display=swap" rel="stylesheet">

</head>
<body>

    {% for feachs in feach %}

        <div class="upload_container" style="background-image: url(' {{ feachs.Image_main.url }} ');">

            <div class="col-md-4 rounded p-3 upload_container_Main w-60">

                <div class="w-100">

                    <h1 class="roboto upload_text">Upload <span style="font-size: 50px;">Bible</span></h1>

                </div>

                <form method="post">

                    {% csrf_token %}
                    {{ form.as_p }}
        
                    <button type="submit" class="btn btn-primary w-75">Save</button>
        
                </form>

            </div>

            <div>

                <img class="img_upload" src="{% static 'IMG/upload/upload1.png' %}" alt="no">

            </div>

        </div>

    {% endfor %}
    
</body>
</html>
