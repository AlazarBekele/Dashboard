<!DOCTYPE html>
<html lang="en">
<head>

    {% comment %} Css Link {% endcomment %}
    <link rel="stylesheet" href="{% static 'design/Service.css' %}">
    <link rel="stylesheet" href="{% static 'Font/font.css' %}">

    <!-- Bootstrap 5 link -->
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&display=swap" rel="stylesheet">

</head>
<body>

    {% for Service_imgs in Service_img %}

        <div class="Service_width" style="background-image: url(' {{ Service_imgs.Picture.url }} ');">

            <div class="All_container">

                    </div>

                    <div class="Service_btn_containers">

                        <div class="btn_container">

                            <button class="Main_btn roboto_thin text-light">እድር</button>
                            <button class="Main_btn roboto_thin text-light">ማህበራዊ ትስስር</button>
                            <button class="Main_btn roboto_thin text-light">ወንጌል ስርጭት</button>

                    </div>

                    <div class="creation">

                        <div class="creation_container">

                            <p class="roboto_thin text-light m-0 pb-1">@EAG 2025</p>

                        </div>

                    </div>

                </div>

                <div class="Second_bar_container">

                    <div>

                        <div class="Youtube_Video">

                            <iframe width="560" height="315" src="https://www.youtube.com/embed/QqJkh8II6Rk?si=5Zi1CRJfSGTpZZ56" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>

                        </div>

                        <div class="Youtube_Title">

                            <h4 class="Main_Youtube_Title">Dawit Getachew @ Dink Sitota Worship Night 2024 ' Eneho Eyesus ' Original Song By Dawit Getachew</h4>
                            <p class="Main_Youtube_Title roboto_thin m-0">View's <span>6k</span></p>

                </div>
