
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>News Upload</title>

    <!-- X icon -->
    <link rel="shortcut icon" type='x-icon' href="{% static 'IMG/Logo/logo.jpg' %}">

    <!-- Bootstrap 5 link -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- CSS static link -->
        <link rel="stylesheet" href="{% static 'design/index.css' %}">
        <link rel="stylesheet" href="{% static 'Font/font.css' %}">
        <link rel="stylesheet" href="{% static 'Animation/animation.css' %}">
        <link rel="stylesheet" href="{% static 'design/News_upload.css' %}">


    <!-- Font Link -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100..900&display=swap" rel="stylesheet">    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100&display=swap" rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet">

</head>
<body>

    <div class="All_container">

        <div class="Loading_container" id="loading_function">

            <div class="spinner-border load_size text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>

        </div>

        <div>

            <img class="upload_IMG" src="{% static 'IMG/DailyNews/upload.svg' %}" alt="no">

        </div>

        <div class="Upload_container">

            <form method="post" enctype="multipart/form-data" class="w-100">

                {% csrf_token %}
                {{ form.as_p }}

                <button type="submit" class="btn btn-primary">Post</button>

            </form>

        </div>

    </div>
    
</body>
</html>
